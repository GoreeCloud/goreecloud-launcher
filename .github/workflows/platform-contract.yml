name: Platform Contract

on:
  pull_request:
    paths:
      - goreecloud.platform.yaml
      - .github/workflows/platform-contract.yml
  push:
    branches:
      - main
    paths:
      - goreecloud.platform.yaml
      - .github/workflows/platform-contract.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Development pin to the exact green head of GoreeCloud/GoreeCloud PR #30,
    # which advances the Contract 0.3 Stable Glaze UI consumer baseline to 1.4.0.
    # Replace this with the accepted immutable mainline revision after central integration.
    uses: GoreeCloud/GoreeCloud/.github/workflows/reusable-platform-manifest.yml@5e10d17f10a4c12cc0a98b595646e4fc5992c1f2
    with:
      manifest-path: goreecloud.platform.yaml
