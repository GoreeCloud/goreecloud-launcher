name: Platform Contract

on:
  pull_request:
    paths:
      - goreecloud.platform.yaml
      - .github/workflows/platform-contract.yml
  push:
    branches:
      - main
    paths:
      - goreecloud.platform.yaml
      - .github/workflows/platform-contract.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Pin Development validation to the accepted central Contract 0.2 mainline
    # revision that preserves exactly seven Integral Platform Systems and requires
    # current Stable GLAZE UI V1.5 / 1.5.0 for applicable consumers.
    uses: GoreeCloud/GoreeCloud/.github/workflows/reusable-platform-manifest.yml@398098d9391ac0369a79f228ca6b94d3c425fe39
    with:
      manifest-path: goreecloud.platform.yaml
