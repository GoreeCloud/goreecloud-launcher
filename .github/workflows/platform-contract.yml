name: Platform Contract

on:
  pull_request:
    paths:
      - goreecloud.platform.yaml
      - .github/workflows/platform-contract.yml
  push:
    branches:
      - main
    paths:
      - goreecloud.platform.yaml
      - .github/workflows/platform-contract.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Development pin to the corrected exact head of GoreeCloud/GoreeCloud PR #30.
    # This Contract 0.3 candidate uses the governed seven Integral Platform Systems
    # and current Stable GLAZE UI 1.4.0 consumer baseline.
    # Replace this with the accepted immutable mainline revision after central integration.
    uses: GoreeCloud/GoreeCloud/.github/workflows/reusable-platform-manifest.yml@96701cc5f20c8e0deaad512d2a9f83e0411f3f18
    with:
      manifest-path: goreecloud.platform.yaml
