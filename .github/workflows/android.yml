name: Android CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: python3 scripts/check_privacy.py
      - run: python3 scripts/check_manifest.py
      - run: python3 scripts/check_identity.py
      - run: python3 scripts/check_glaze_ui.py
      - run: python3 scripts/check_glaze_motion_evaluation.py
      - run: python3 scripts/check_room_cutover.py
      - run: gradle --no-daemon lintDebug testDebugUnitTest assembleDebug
      - run: python3 scripts/check_room_schema.py
      - run: |
          if [ -n "$(git status --porcelain -- app/schemas)" ]; then
            echo "Room schema history changed during generation and is not committed exactly."
            git status --short -- app/schemas
            exit 1
          fi
          echo "Committed Room schema history matches generated output."

  room-runtime-emulator:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Room transition runtime suite on Android 16
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: default
          arch: x86_64
          disable-animations: true
          script: gradle --no-daemon connectedDebugAndroidTest
