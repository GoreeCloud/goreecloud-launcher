name: Android CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: python3 scripts/check_privacy.py
      - run: python3 scripts/check_manifest.py
      - run: python3 scripts/check_glaze_ui.py
      - run: gradle --no-daemon lintDebug testDebugUnitTest assembleDebug
      - run: python3 scripts/check_room_schema.py
