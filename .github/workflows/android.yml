name: Android CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source and Development identity
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SOURCE_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          SOURCE_SHA="$(git rev-parse HEAD)"
          test "$SOURCE_SHA" = "$EXPECTED_SOURCE_SHA"

          APPLICATION_ID="$(sed -n 's/.*applicationId = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test "$APPLICATION_ID" = "com.goreecloud.launcher"
          test "$VERSION_NAME" = "0.1.0-dev"

          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "APPLICATION_ID=$APPLICATION_ID" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-version: "8.11.1"
      - run: python3 scripts/check_privacy.py
      - run: python3 scripts/check_manifest.py
      - run: python3 scripts/check_identity.py
      - run: python3 scripts/check_glaze_ui.py
      - run: python3 scripts/check_glaze_motion_evaluation.py
      - run: python3 scripts/check_room_cutover.py
      - run: gradle --no-daemon lintDebug testDebugUnitTest assembleDebug
      - run: python3 scripts/check_room_schema.py
      - run: |
          if [ -n "$(git status --porcelain -- app/schemas)" ]; then
            echo "Room schema history changed during generation and is not committed exactly."
            git status --short -- app/schemas
            exit 1
          fi
          echo "Committed Room schema history matches generated output."
      - name: Stage self-verifying Launcher Development APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK"

          ARTIFACT_ROOT="artifact-launcher-android"
          rm -rf "$ARTIFACT_ROOT"
          mkdir -p "$ARTIFACT_ROOT"
          cp "$APK" "$ARTIFACT_ROOT/"

          cat > "$ARTIFACT_ROOT/BUILD-PROVENANCE.txt" <<EOF
          repository=GoreeCloud/goreecloud-launcher
          source_sha=$SOURCE_SHA
          version_name=$VERSION_NAME
          application_id=$APPLICATION_ID
          workflow=$GITHUB_WORKFLOW
          run_id=$GITHUB_RUN_ID
          run_attempt=$GITHUB_RUN_ATTEMPT
          artifact_role=android-launcher-development-acceptance
          signing_role=ci-debug-installability-only
          stable_release_authority=none
          EOF

          (
            cd "$ARTIFACT_ROOT"
            sha256sum ./*.apk > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
      - name: Upload Launcher Development APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: goreecloud-launcher-android-dev
          if-no-files-found: error
          path: artifact-launcher-android/*

  room-runtime-emulator:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-version: "8.11.1"
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Room transition runtime suite on Android 16
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: default
          arch: x86_64
          disable-animations: true
          script: gradle --no-daemon connectedDebugAndroidTest
