  mesh:
    result: applicable-blocked
    version: null
    evidence: []
    notes: Canonical GoreeCloud Mesh registration, capability publication, producer evidence, and runtime acceptance are not established for Launcher.
    capabilities: []
    dependencies: []
    published_events: []
    consumed_events: []
  identity:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
    notes: Core Launcher use is local and does not require an account, but accepted GoreeCloud Identity integration for future identity-aware or synchronized capabilities is not established.

health:
  health_endpoint: null
  readiness_endpoint: null

continuity:
  backup:
    required: true
    requirements:
      - Define the approved Launcher-owned backup scope beyond the current workspace-placement and explicit-preference subsets.
      - Include only state whose preservation is authorized under applicable Privacy Shield and Everkeep requirements.
  restore:
    required: true
    requirements:
      - Preserve strict validation of both current portable formats before either read-only preview or the combined LauncherPortableRestoreWriter path proceeds.
      - Reject a combined pair before preview or persistence when workspace grid columns/rows do not exactly match the portable Home-grid preference columns/rows.
      - Keep preview output limited to aggregate workspace geometry/counts plus the seven reviewed preference values and opaque review token, without page/item identities, package/profile state, widget bindings, or persistence authority.
      - Preserve the current concrete bounded Room/DataStore writer's readback verification and fail-closed guarded rollback semantics without representing its compensation model as crash atomicity.
      - Keep the current workspace restore limited to the exact already-resolved HOME APP identity set; do not invent package/profile/folder/shortcut/widget rebinding from a format that does not carry those identities.
      - Define and validate clean-target Android package, profile, folder, shortcut, dock, widget, and provider rebinding or deterministic reconstruction behavior before complete restore is claimed.
      - Establish crash/interruption recovery, accepted Everkeep integration, representative-device acceptance, and production recovery evidence before recovery qualification.
  export:
    required: true
    requirements:
      - Preserve the existing goreecloud-launcher-workspace-snapshot/1 and goreecloud-launcher-preferences/1 Development formats without silently widening their authority.
      - Keep package discovery, profile identity, widget bindings, hidden-app state, credentials, and unrelated system state out of portable output unless separately approved.
  portability:
    required: true
    requirements:
      - Preserve workspace ordering, placement integrity, and the explicit Launcher preference values represented by the current versioned codecs.
      - Require pair-level Home-grid consistency whenever the two current formats are treated as one restore candidate.
      - Preserve review/apply consistency when a user-facing preview precedes persistence.
      - Keep clean-target/cross-device identity reconstruction fail-closed until a separately approved format and rebinding policy can express the necessary Android identities.
      - Validate complete product scope, clean-target import or deterministic reconstruction, and conflict behavior before product-wide portability is claimed.

external_dependencies:
  - name: Android platform
    purpose: Android HOME role, LauncherApps discovery, package/profile lifecycle, wallpaper presentation, accessibility services, and application execution environment.
    required: true
    version_constraint: ">=29"

compatibility:
  platform_contract: "0.2"
  glaze_ui_required: "1.1.0"
  requires:
    - goreecloud-platform-contract==0.2
    - glaze-ui==1.1.0
    - android-api>=29
  provides:
    - goreecloud-launcher-workspace-snapshot/1
    - goreecloud-launcher-preferences/1

evidence:
  acceptance_tests:
    - app/src/androidTest/java/com/goreecloud/launcher/core/launcher/LauncherPortableRestorePersistenceRuntimeTest.kt
  release: []

conformance:
  status: nonconformant
  validated_at: null
  evidence:
    - README.md
    - SPECIFICATIONS.md
    - docs/glaze-ui-adoption.md
    - scripts/check_glaze_ui.py
    - docs/development/workspace-portable-snapshot.md
    - docs/development/launcher-portable-preferences.md
    - docs/development/portable-restore-coordinator.md
    - docs/development/portable-restore-preview.md
    - app/src/main/java/com/goreecloud/launcher/core/launcher/LauncherTransactionalPortableRestoreWriter.kt
    - app/src/main/java/com/goreecloud/launcher/core/workspace/db/WorkspaceDao.kt
    - app/src/androidTest/java/com/goreecloud/launcher/core/launcher/LauncherPortableRestorePersistenceRuntimeTest.kt
  blockers:
    - GLAZE UI V1.1 / 1.1.0 source mapping exists, but complete application-specific rendered, accessibility, adaptive, representative-device, Human Visual Excellence, release, and production acceptance remain outstanding.
    - GoreeCloud Identity integration and acceptance are not established.
    - Wardveil Security integration and acceptance are not established.
    - Privacy Shield integration and acceptance are not established.
    - Everkeep integration plus complete Launcher backup and clean-target restore acceptance remain incomplete; bounded Room/DataStore persistence and guarded compensation exist, but cross-device identity reconstruction and crash/interruption recovery are not established.
    - GoreeCloud Mesh registration, capability publication, and runtime acceptance are not established.
    - Manager platform visibility and administrative integration acceptance are not established.
    - Product-wide export and import scope remains incomplete beyond the bounded workspace-placement and explicit-preference formats.
    - Signed representative-device HOME-role, lifecycle, accessibility, restore, rollback, upgrade, and release-candidate acceptance remain outstanding.
    - Production signing, distribution, deployment, release approval, and Stable qualification remain outstanding.
