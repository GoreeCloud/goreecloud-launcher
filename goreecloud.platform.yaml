schema_version: "0.2"

component:
  type: application
  id: goreecloud-launcher
  product_name: GoreeCloud Launcher
  repository: GoreeCloud/goreecloud-launcher

lifecycle: development
version: "0.1.0-dev"

supported_platforms:
  - android

api:
  versions: []
  endpoints: []

platform_systems:
  manager:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
    notes: Canonical Mesh registration and accepted GoreeCloud Manager platform visibility are not established for Launcher.
  privacy_shield:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - docs/development/workspace-portable-snapshot.md
      - docs/development/launcher-portable-preferences.md
      - docs/development/portable-restore-coordinator.md
      - docs/development/portable-restore-preview.md
    notes: Launcher is local-first and the current portable codecs, pair-compatibility validation, reviewed-apply guard, and bounded persistence path remain privacy-minimized, but accepted Privacy Shield integration and production privacy validation are not established.
  wardveil_security:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - app/src/main/java/com/goreecloud/launcher/core/launcher/LauncherTransactionalPortableRestoreWriter.kt
      - app/src/main/java/com/goreecloud/launcher/core/workspace/db/WorkspaceDao.kt
      - docs/development/portable-restore-coordinator.md
      - docs/development/portable-restore-preview.md
    notes: Launcher restore validation fails closed on incompatible payloads and unsupported target identity state, and guarded rollback refuses to overwrite concurrent changes, but accepted Wardveil Security integration and validation are not established.
  everkeep:
    result: applicable-blocked
    version: null
    evidence:
      - app/src/main/java/com/goreecloud/launcher/core/launcher/LauncherTransactionalPortableRestoreWriter.kt
      - app/src/main/java/com/goreecloud/launcher/core/workspace/db/WorkspaceDao.kt
      - app/src/androidTest/java/com/goreecloud/launcher/core/launcher/LauncherPortableRestorePersistenceRuntimeTest.kt
      - docs/development/workspace-portable-snapshot.md
      - docs/development/launcher-portable-preferences.md
      - docs/development/portable-restore-coordinator.md
      - docs/development/portable-restore-preview.md
    notes: Versioned workspace-placement and explicit preference snapshots now have validation-before-write, pair-level Home-grid compatibility, a reviewed-apply guard, a concrete Room/DataStore Development writer, readback verification, guarded compensation, and emulator coverage. Complete clean-target reconstruction, crash/interruption recovery, full Launcher-owned recovery scope, and accepted Everkeep integration remain incomplete.
  glaze_ui:
    result: applicable-migration-required
    version: "1.1.0"
    evidence:
      - app/src/main/java/com/goreecloud/launcher/ui/theme/GlazeMetrics.kt
      - app/src/main/java/com/goreecloud/launcher/ui/theme/GlazeAtmosphere.kt
      - app/src/main/java/com/goreecloud/launcher/ui/theme/GlazeTheme.kt
      - app/src/main/java/com/goreecloud/launcher/ui/theme/GlazeThemeManagerCatalog.kt
      - app/src/main/java/com/goreecloud/launcher/ui/theme/ThemeManagerSurface.kt
      - app/src/test/java/com/goreecloud/launcher/ui/theme/GlazeMetricsContractTest.kt
      - app/src/test/java/com/goreecloud/launcher/ui/theme/GlazeThemeManagerCatalogTest.kt
