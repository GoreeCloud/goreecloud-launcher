schema_version: "1.0"
component:
  id: goreecloud.launcher
  product_name: GoreeCloud Launcher
  kind: application
  repository: GoreeCloud/goreecloud-launcher
  lifecycle: Development
  version: "0.1.0-dev"
  supported_platforms:
    - android
  user_facing: true
api:
  version: null
  endpoints: []
glaze_ui:
  applicable: true
  required_version: "1.0.0"
  implemented_version: "1.0.0"
  migration_status: in_progress
  evidence:
    - launcher-glaze-source
    - launcher-glaze-validator
    - launcher-glaze-doc
platform_systems:
  manager:
    status: "Applicable — Nonconformant"
    justification: Launcher is intended to participate in the unified GoreeCloud platform visibility model, but canonical Mesh registration and accepted Manager Platform Overview visibility are not established.
    evidence:
      - launcher-readme
  identity:
    status: "Applicable — Nonconformant"
    justification: Core Launcher use is local and does not require an account, while approved cross-device and identity-aware capabilities remain separate work; accepted GoreeCloud Identity integration is not established.
    evidence:
      - launcher-readme
  wardveil_security:
    status: "Applicable — Nonconformant"
    justification: Launcher enforces Android permission and authority boundaries, but current Wardveil Security integration and acceptance evidence are not established.
    evidence:
      - launcher-readme
  privacy_shield:
    status: "Applicable — Nonconformant"
    justification: Launcher is local-first and CI enforces privacy-oriented source constraints; the current portable codecs are pure in-memory transformations with no discovery, network, or persistence authority, but Privacy Shield integration and acceptance evidence are not established.
    evidence:
      - launcher-readme
      - launcher-ci-201
      - launcher-workspace-snapshot-doc
      - launcher-preferences-snapshot-doc
  everkeep:
    status: "Applicable — Nonconformant"
    justification: Bounded versioned workspace-placement and explicit Launcher-preference snapshots now exist as Development source, but complete Launcher backup/restore and authorized Everkeep continuity integration remain explicit gaps.
    evidence:
      - launcher-readme
      - launcher-workspace-snapshot-source
      - launcher-workspace-snapshot-doc
      - launcher-preferences-snapshot-source
      - launcher-preferences-snapshot-doc
  mesh:
    status: "Applicable — Nonconformant"
    justification: Launcher is not yet registered through the canonical GoreeCloud Mesh platform registry and no accepted Mesh integration evidence is recorded here.
    evidence:
      - launcher-readme
  glaze_ui:
    status: "Applicable — Migration Required"
    justification: Repository-local GLAZE UI V1.0 geometry, Light/Dark foundation, Theme Manager, and authority mappings are implemented against exact canonical post-reset source revision 70909bbdccad378fb7281ae1842e2f5beed64c38, but exact-head CI plus complete native/rendered/accessibility/device/Human Visual Excellence/release acceptance remain outstanding.
    evidence:
      - launcher-glaze-source
      - launcher-glaze-validator
      - launcher-glaze-doc
mesh:
  registration: required
  capabilities:
    - android-home-presentation
    - application-navigation
    - launcher-personalization
    - goreecloud-index-invocation
  dependencies:
    - goreecloud.index
  published_events: []
  consumed_events: []
  evidence: []
health:
  liveness: []
  readiness: []
recovery:
  backup_required: true
  backup_status: required_missing
  restore_required: true
  restore_status: required_missing
  last_verified_restore: null
  recovery_dependencies:
    - Room workspace and placement state
    - DataStore launcher preferences
    - theme and Home configuration
    - Android package/profile-derived state reconstruction
    - complete folder and widget reconstruction/rebinding behavior
  documentation:
    - README.md
    - SPECIFICATIONS.md
    - docs/development/workspace-portable-snapshot.md
    - docs/development/launcher-portable-preferences.md
  evidence:
    - launcher-readme
    - launcher-workspace-snapshot-source
    - launcher-workspace-snapshot-doc
    - launcher-workspace-snapshot-tests
    - launcher-preferences-snapshot-source
    - launcher-preferences-snapshot-doc
    - launcher-preferences-snapshot-tests
data_portability:
  export_capability: unknown
  export_formats:
    - goreecloud-launcher-workspace-snapshot/1
    - goreecloud-launcher-preferences/1
  last_export_validation: null
  portability_requirements:
    - define a complete versioned Launcher-owned export scope beyond the current workspace-placement and explicit-preference subsets
    - preserve workspace ordering and placement integrity
    - preserve explicit Home grid, Drawer columns, label visibility, icon scale, layout-lock, and Index Home mode values without silently sanitizing invalid portable input
    - preserve local-first privacy boundaries during export and restore
    - define folder, dock, widget, theme, gesture, hidden-app, search-setting, and authoritative persistence coverage not represented by the current codecs
    - define Android package/profile and widget rebinding semantics
    - validate clean-target import or deterministic reconstruction where applicable
    - keep decoding separate from Room/DataStore mutation until an authorized transactional restore coordinator exists
  evidence:
    - launcher-readme
    - launcher-workspace-snapshot-source
    - launcher-workspace-snapshot-doc
    - launcher-workspace-snapshot-tests
    - launcher-preferences-snapshot-source
    - launcher-preferences-snapshot-doc
    - launcher-preferences-snapshot-tests
external_dependencies:
  - id: android-platform
    purpose: Android HOME role, LauncherApps discovery, package/profile lifecycle, system wallpaper presentation, accessibility services, and application execution environment.
    required: true
    compatibility: Current source targets Android API 36 with minSdk 29; role, package-visibility, lifecycle, accessibility, and supported-device behavior require release acceptance.
compatibility:
  platform_releases: []
  api_requirements:
    - com.goreecloud.index.action.SEARCH for the current Development GoreeCloud Index handoff
  schema_requirements:
    - goreecloud.platform/1.0
    - goreecloud-launcher-workspace-snapshot/1
    - goreecloud-launcher-preferences/1
  component_requirements:
    - GLAZE UI V1.0 (1.0.0)
    - GoreeCloud Index compatible invocation contract before search integration acceptance
    - GoreeCloud Mesh platform registry v1 before platform visibility acceptance
    - GoreeCloud Identity accepted integration for applicable identity-aware capabilities before Stable
    - Privacy Shield, Wardveil Security, and Everkeep accepted integration before Stable
conformance:
  declared_state: migration_required
  stable_eligible: false
  checks:
    - {id: glaze-ui, mandatory: true, status: pending, evidence: [launcher-glaze-source, launcher-glaze-validator, launcher-glaze-doc], note: "Repository-local GLAZE UI V1.0 source mapping exists against exact post-reset authority; exact-head CI and complete native/rendered/accessibility/device/HVE/release acceptance remain incomplete."}
    - {id: goreecloud-identity, mandatory: true, status: pending, evidence: [launcher-readme]}
    - {id: wardveil-security, mandatory: true, status: pending, evidence: [launcher-readme]}
    - {id: privacy-shield, mandatory: true, status: pending, evidence: [launcher-readme, launcher-ci-201, launcher-workspace-snapshot-doc, launcher-preferences-snapshot-doc], note: "Pure local portability codecs and repository privacy validation are not Privacy Shield platform acceptance."}
    - {id: everkeep-recovery, mandatory: true, status: pending, evidence: [launcher-readme, launcher-workspace-snapshot-source, launcher-workspace-snapshot-doc, launcher-preferences-snapshot-source, launcher-preferences-snapshot-doc], note: "The workspace and preference snapshots are bounded Development serialization seams, not complete Launcher recovery or Everkeep integration."}
    - {id: mesh-registration, mandatory: true, status: pending, evidence: []}
    - {id: api-compatibility, mandatory: true, status: pending, evidence: [launcher-readme], note: "The Development Index handoff exists, but coordinated release-level API compatibility is not established."}
    - {id: accessibility, mandatory: true, status: pending, evidence: [launcher-glaze-doc], note: "Source semantics and V1 geometry mapping exist; TalkBack, Switch Access, focus, large-text/reflow, adaptive, and representative-device acceptance remain outstanding."}
    - {id: platform-acceptance, mandatory: true, status: pending, evidence: []}
    - {id: backup, mandatory: true, status: pending, evidence: [launcher-readme, launcher-workspace-snapshot-source, launcher-workspace-snapshot-doc, launcher-preferences-snapshot-source, launcher-preferences-snapshot-doc], note: "The current codecs cover bounded workspace-placement and explicit-preference subsets while substantial Launcher state remains outside the backup scope."}
    - {id: restore, mandatory: true, status: pending, evidence: [launcher-readme, launcher-workspace-snapshot-source, launcher-workspace-snapshot-doc, launcher-preferences-snapshot-source, launcher-preferences-snapshot-doc], note: "Decoding returns validated in-memory state only and cannot write Room/DataStore or rebind packages/profiles/widgets."}
    - {id: export-portability, mandatory: true, status: pending, evidence: [launcher-readme, launcher-workspace-snapshot-source, launcher-workspace-snapshot-doc, launcher-workspace-snapshot-tests, launcher-preferences-snapshot-source, launcher-preferences-snapshot-doc, launcher-preferences-snapshot-tests], note: "Versioned workspace-placement and explicit-preference subsets exist, but product-wide export/import scope and clean-target acceptance remain pending."}
    - {id: security-validation, mandatory: true, status: pending, evidence: [launcher-readme], note: "Android authority and permission controls do not establish Wardveil Security acceptance."}
    - {id: privacy-validation, mandatory: true, status: pending, evidence: [launcher-readme, launcher-ci-201, launcher-workspace-snapshot-doc, launcher-preferences-snapshot-doc], note: "The codecs do not gain discovery/network/persistence authority, but repository privacy guards do not establish Privacy Shield acceptance."}
    - {id: required-documentation, mandatory: true, status: pass, evidence: [launcher-readme, launcher-glaze-doc, launcher-workspace-snapshot-doc, launcher-preferences-snapshot-doc]}
    - {id: required-tests, mandatory: true, status: pending, evidence: [launcher-ci-201, launcher-workspace-snapshot-tests, launcher-preferences-snapshot-tests], note: "Android CI #201 remains pre-reset repository evidence for the workspace-snapshot base. The portable-preference leaf plus this GLAZE UI V1.0 migration require fresh exact-head Android CI before current required-tests can pass."}
    - {id: release-evidence, mandatory: true, status: pending, evidence: []}
evidence:
  acceptance:
    - id: launcher-readme
      kind: documentation
      location: README.md
      revision: null
      observed_at: null
      producer: GoreeCloud/goreecloud-launcher
      description: Repository-local Development behavior, authority boundaries, privacy posture, platform-integration gaps, recovery gaps, and validation baseline. Documentation alone does not satisfy implementation or production gates.
    - id: launcher-glaze-source
      kind: source
      location: app/src/main/java/com/goreecloud/launcher/ui/theme/GlazeMetrics.kt
      revision: null
      observed_at: null
      producer: GoreeCloud/goreecloud-launcher
      description: Native Android mapping of the consumed GLAZE UI V1.0 geometry and interaction floors pinned to exact canonical post-reset source revision 70909bbdccad378fb7281ae1842e2f5beed64c38. Source mapping does not establish complete application acceptance.
    - id: launcher-glaze-validator
      kind: automated_test
      location: scripts/check_glaze_ui.py
      revision: null
      observed_at: null
      producer: GoreeCloud/goreecloud-launcher
      description: Fail-closed repository contract for the bounded GLAZE UI V1.0 mapping and explicit production block. Validator source is not itself a successful run.
    - id: launcher-glaze-doc
      kind: documentation
      location: docs/glaze-ui-adoption.md
      revision: null
      observed_at: null
      producer: GoreeCloud/goreecloud-launcher
      description: Repository-local GLAZE UI V1.0 source mapping, System Shell classification, accessibility, authority, historical-evidence boundary, and outstanding acceptance record.
    - id: launcher-ci-201
      kind: automated_test
      location: https://github.com/GoreeCloud/goreecloud-launcher/actions/runs/33710502911
      revision: 5fb72cfab3fc3770e578c9ad3b79ba76d4dc0bcd
      observed_at: null
      producer: GoreeCloud/goreecloud-launcher
      description: Pre-reset exact-head Android CI #201 passed the workspace portable snapshot base with repository privacy/manifest/Identity/then-current-Glaze/Room governance checks, Android lint, JVM unit tests, debug APK assembly, Room schema cleanliness, and Android 16 Room runtime emulator testing. It is historical Development evidence and does not establish GLAZE UI V1.0 acceptance.
    - id: launcher-workspace-snapshot-source
      kind: source
      location: app/src/main/java/com/goreecloud/launcher/core/workspace/WorkspacePortableSnapshot.kt
      revision: null
      observed_at: null
      producer: GoreeCloud/goreecloud-launcher
      description: Versioned deterministic bounded serializer/decoder for framework-independent Launcher grid, page, and placement state with strict validation and SHA-256 integrity checking; it has no persistence or restore authority.
    - id: launcher-workspace-snapshot-doc
      kind: documentation
      location: docs/development/workspace-portable-snapshot.md
      revision: null
      observed_at: null
      producer: GoreeCloud/goreecloud-launcher
      description: Explicit Development scope, exclusions, privacy boundary, and Everkeep/recovery acceptance gap for the workspace snapshot subset.
    - id: launcher-workspace-snapshot-tests
      kind: source
      location: app/src/test/java/com/goreecloud/launcher/core/workspace/WorkspacePortableSnapshotTest.kt
      revision: null
      observed_at: null
      producer: GoreeCloud/goreecloud-launcher
      description: Unit-test source for deterministic round-trip, opaque Unicode identities, tamper rejection, invalid page ranks, placement collisions, and bounded input. Test source is not itself evidence of a successful run.
    - id: launcher-preferences-snapshot-source
      kind: source
      location: app/src/main/java/com/goreecloud/launcher/core/launcher/LauncherPortablePreferences.kt
      revision: null
      observed_at: null
      producer: GoreeCloud/goreecloud-launcher
      description: Versioned deterministic bounded codec for the seven existing LauncherPreferences values with strict range, enum, boolean, integer-thousandth icon-scale, exact-record, and SHA-256 integrity validation and no DataStore authority.
    - id: launcher-preferences-snapshot-doc
      kind: documentation
      location: docs/development/launcher-portable-preferences.md
      revision: null
      observed_at: null
      producer: GoreeCloud/goreecloud-launcher
      description: Development scope, validation, authority, excluded-state, workspace-format relationship, and Everkeep/recovery acceptance boundaries for the explicit Launcher preference snapshot.
    - id: launcher-preferences-snapshot-tests
      kind: source
      location: app/src/test/java/com/goreecloud/launcher/core/launcher/LauncherPortablePreferencesTest.kt
      revision: null
      observed_at: null
      producer: GoreeCloud/goreecloud-launcher
      description: Unit-test source covering deterministic round-trip, tamper rejection, unknown-record rejection, strict out-of-range failure, noncanonical icon scale, and bounded input. Test source is not itself evidence of a successful run.
  release: []
